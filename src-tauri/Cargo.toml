[package]
name = "devdeck-scaffold"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devdeck_scaffold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
git2 = { version = "0.20", default-features = false }
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
notify-debouncer-mini = "0.4"
ureq = "2"


# Компактный релиз: размер важнее скорости компиляции (см. обсуждение размера бандла).
[profile.release]
opt-level = "s"     # оптимизация по размеру
lto = true          # межкрейтовая оптимизация, выкидывает неиспользуемый код
codegen-units = 1   # лучшее качество оптимизации ценой времени сборки
strip = true        # без отладочных символов в бинаре
panic = "abort"     # без раскрутки стека: меньше кода
