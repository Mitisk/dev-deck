# Сборка и публикация релиза DevDeck по тегу v*.
# Выпуск версии: `npm version minor` (или patch/major) → `git push --follow-tags`.
# Секреты репозитория: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (см. README).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Собирает MSI/NSIS, подписывает updater-артефакты, создаёт GitHub Release
      # и выкладывает latest.json — его читает приложение при проверке обновлений.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevDeck ${{ github.ref_name }}"
          releaseBody: "Установщик для Windows во вложениях. Приложение обновится само при следующем запуске."
          releaseDraft: false
          prerelease: false
