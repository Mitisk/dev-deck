<!doctype html>
<html lang="ru" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevDeck</title>

<!-- Шрифты: гротеск для интерфейса, моноширинный для кода/git/путей.
     Если CDN недоступен — system-ui / ui-monospace перехватят (graceful fallback). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   DevDeck — дизайн-система (все токены вынесены наверх для лёгкой правки)
   Смена темы — переключением класса .dark / .light на <html>.
   ========================================================================== */
:root {
  /* типографика */
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", "Cascadia Code", monospace;

  /* радиусы / тени / переходы */
  --r-sm: 8px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
  --ease: cubic-bezier(.2,.6,.2,1);
  --t: 150ms var(--ease);

  /* акцент приложения (единый) */
  --accent: #7c7dff;
  --accent-ink: #ffffff;
  --accent-soft: color-mix(in oklab, var(--accent) 16%, transparent);

  /* семантика git */
  --git-ahead:  #3fb863;   /* впереди / можно push */
  --git-dirty:  #e0a83a;   /* есть изменения */
  --git-clean:  var(--muted);
  --danger:     #f0616d;
}

/* ---- Тёмная тема (по умолчанию) ---- */
html.dark {
  --bg:        #0e0f12;          /* глубокий нейтральный, не чистый чёрный */
  --bg-grad:   #121317;
  --surface:   #16181d;
  --surface-2: #1c1f25;
  --surface-3: #232730;
  --text:      #e9eaee;
  --text-2:    #c3c6cd;
  --muted:     #7e828c;
  --muted-2:   #5a5e68;
  --border:    rgba(255,255,255,.07);
  --border-2:  rgba(255,255,255,.11);
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg: 0 24px 70px -20px rgba(0,0,0,.7);
  --hover:     rgba(255,255,255,.04);
  --hover-2:   rgba(255,255,255,.07);
  color-scheme: dark;
}

/* ---- Светлая тема ---- */
html.light {
  --bg:        #f6f6f8;
  --bg-grad:   #f1f1f4;
  --surface:   #ffffff;
  --surface-2: #f7f7f9;
  --surface-3: #eef0f3;
  --text:      #16181d;
  --text-2:    #3a3d45;
  --muted:     #71747d;
  --muted-2:   #9a9da6;
  --border:    rgba(15,18,25,.09);
  --border-2:  rgba(15,18,25,.14);
  --shadow:    0 1px 2px rgba(15,18,25,.06), 0 10px 28px -16px rgba(15,18,25,.22);
  --shadow-lg: 0 24px 60px -22px rgba(15,18,25,.28);
  --hover:     rgba(15,18,25,.035);
  --hover-2:   rgba(15,18,25,.06);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
::selection { background: var(--accent-soft); }

/* скроллбары */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--muted-2); background-clip: padding-box; }

/* иконки lucide */
.ic { width: 16px; height: 16px; stroke-width: 2; flex: none; }
.ic-sm { width: 14px; height: 14px; }
.ic-lg { width: 20px; height: 20px; }
[data-lucide] { display: inline-flex; }

button { font-family: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
.mono { font-family: var(--font-mono); font-feature-settings: "ss02","zero"; }

/* ============================================================================
   КАРКАС: сайдбар + рабочая область
   ========================================================================== */
#app {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: 100vh;
}

/* ---------- Сайдбар ---------- */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.sb-head {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 18px 14px;
}
.logo {
  width: 28px; height: 28px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(160deg, var(--accent), color-mix(in oklab, var(--accent) 55%, #000));
  color: #fff; box-shadow: 0 2px 10px -2px var(--accent-soft);
}
.logo svg { width: 17px; height: 17px; }
.wordmark { font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
.wordmark span { color: var(--muted); font-weight: 500; }
.sb-head .ver { margin-left: auto; font-size: 11px; color: var(--muted-2); }

.sb-search {
  margin: 2px 14px 10px;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 8px 10px;
  color: var(--muted);
  transition: border-color var(--t), background var(--t);
}
.sb-search:hover { border-color: var(--border-2); }
.sb-search input {
  flex: 1; background: none; border: 0; outline: none; color: var(--text);
  font-family: inherit; font-size: 13px;
}
.sb-search input::placeholder { color: var(--muted); }
.kbd {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--muted);
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: 5px; padding: 2px 5px; line-height: 1; white-space: nowrap;
}

.sb-new {
  margin: 0 14px 8px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: var(--r-md); padding: 9px;
  font-weight: 600; font-size: 13px;
  transition: filter var(--t), transform var(--t);
}
.sb-new:hover { filter: brightness(1.08); }
.sb-new:active { transform: translateY(1px); }

.sb-scroll { flex: 1; overflow-y: auto; padding: 6px 10px 14px; min-height: 0; }
.sb-section { margin: 10px 6px 4px; display: flex; align-items: center; gap: 6px; }
.sb-section span { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.sb-section .count { margin-left: auto; font-size: 11px; color: var(--muted-2); }

.proj {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 9px; border-radius: var(--r-md);
  cursor: pointer; position: relative;
  transition: background var(--t);
  color: var(--text-2);
}
.proj:hover { background: var(--hover); }
.proj.active { background: var(--hover-2); color: var(--text); }
.proj.active::before {
  content: ""; position: absolute; left: -8px; top: 50%; translate: 0 -50%;
  width: 3px; height: 18px; border-radius: 99px; background: var(--p-color, var(--accent));
}
.proj .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--p-color); flex: none; box-shadow: 0 0 0 3px color-mix(in oklab, var(--p-color) 18%, transparent); }
.proj .emoji { font-size: 15px; line-height: 1; }
.proj .nm { flex: 1; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj .meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.proj .meta.dirty { color: var(--git-dirty); }
.proj .meta.ahead { color: var(--git-ahead); }

.sb-foot { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
.sb-foot .avatar {
  width: 26px; height: 26px; border-radius: 99px; flex: none;
  background: linear-gradient(135deg, #5b6cff, #b06cff); color: #fff;
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
}
.sb-foot .who { font-size: 12px; font-weight: 600; line-height: 1.2; }
.sb-foot .who small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
.icon-btn {
  width: 30px; height: 30px; flex: none; border-radius: var(--r-sm);
  border: 1px solid transparent; background: none; color: var(--muted);
  display: grid; place-items: center; transition: var(--t);
}
.icon-btn:hover { background: var(--hover-2); color: var(--text); }
.icon-btn.on { color: var(--accent); }

/* ---------- Рабочая область ---------- */
.workspace { min-width: 0; min-height: 0; overflow-y: auto; background: linear-gradient(180deg, var(--bg-grad), var(--bg) 220px); }
.ws-inner { max-width: 1080px; margin: 0 auto; padding: 22px 30px 60px; }

/* Шапка проекта */
.proj-head { display: flex; align-items: flex-start; gap: 14px; }
.proj-head .big-emoji {
  width: 52px; height: 52px; border-radius: var(--r-lg); flex: none;
  display: grid; place-items: center; font-size: 26px;
  background: var(--surface-2); border: 1px solid var(--border);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--p-color) 22%, transparent);
}
.proj-head h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.proj-head .sub { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.proj-head .path { font-size: 12px; }
.pill {
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
  border: 1px solid var(--border-2); color: var(--text-2);
  display: inline-flex; align-items: center; gap: 5px;
}
.pill .led { width: 6px; height: 6px; border-radius: 99px; background: var(--git-ahead); }
.pill.active { color: var(--git-ahead); border-color: color-mix(in oklab, var(--git-ahead) 35%, transparent); background: color-mix(in oklab, var(--git-ahead) 12%, transparent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 7px; font-family: var(--font-mono); }

.head-actions { margin-left: auto; display: flex; gap: 6px; }
.act {
  height: 36px; padding: 0 11px; border-radius: var(--r-md);
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500;
  transition: var(--t);
}
.act:hover { background: var(--surface-3); border-color: var(--border-2); color: var(--text); transform: translateY(-1px); }
.act:active { transform: translateY(0); }
.act.sq { width: 36px; padding: 0; justify-content: center; }

/* Git-панель */
.git-bar {
  margin-top: 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 11px 14px; box-shadow: var(--shadow);
}
.git-bar .seg { display: flex; align-items: center; gap: 7px; }
.git-bar .branch { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.git-bar .branch svg { color: var(--muted); }
.aheadbehind { font-family: var(--font-mono); font-size: 12px; display: inline-flex; gap: 7px; }
.aheadbehind .a { color: var(--git-ahead); }
.aheadbehind .b { color: var(--muted); }
.dirty-count { font-size: 12px; color: var(--git-dirty); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.dirty-count .led { width: 7px; height: 7px; border-radius: 99px; background: var(--git-dirty); }
.last-commit { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.last-commit .hash { font-family: var(--font-mono); color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.last-commit .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.git-sep { width: 1px; height: 22px; background: var(--border); }
.git-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.gbtn {
  height: 32px; padding: 0 11px; border-radius: var(--r-sm);
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
  font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  transition: var(--t);
}
.gbtn:hover { background: var(--surface-3); border-color: var(--border-2); color: var(--text); }
.gbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.gbtn.primary:hover { filter: brightness(1.08); }
.commit-field { display: flex; align-items: center; gap: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
.commit-field input { background: none; border: 0; outline: none; color: var(--text); font-family: inherit; font-size: 12.5px; padding: 7px 10px; width: 168px; }
.commit-field input::placeholder { color: var(--muted-2); }
.commit-field button { height: 30px; padding: 0 11px; border: 0; border-left: 1px solid var(--border); background: var(--surface-3); color: var(--text-2); font-size: 12px; font-weight: 600; }
.commit-field button:hover { color: var(--text); }

/* Табы */
.tabs { margin-top: 18px; display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tab {
  position: relative; background: none; border: 0; padding: 9px 13px 12px;
  color: var(--muted); font-size: 13px; font-weight: 500; transition: color var(--t);
}
.tab:hover { color: var(--text-2); }
.tab.active { color: var(--text); }
.tab.active::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.tab .badge { margin-left: 6px; font-size: 11px; color: var(--muted); background: var(--surface-3); border-radius: 99px; padding: 1px 6px; }

.tab-body { margin-top: 22px; }

/* блоки/карточки общего вида */
.section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.section-title .more { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; cursor: pointer; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; }
.stack { display: flex; flex-direction: column; gap: 26px; }

/* Обзор: описание */
.desc { color: var(--text-2); font-size: 13.5px; line-height: 1.6; }

/* кастомные команды */
.cmd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.cmd {
  text-align: left; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 13px; display: flex; flex-direction: column; gap: 10px;
  transition: var(--t); box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.cmd:hover { border-color: var(--border-2); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.cmd:active { transform: translateY(0); }
.cmd .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--c-tint, var(--accent)); background: color-mix(in oklab, var(--c-tint, var(--accent)) 14%, transparent); }
.cmd .lbl { font-size: 13px; font-weight: 600; }
.cmd .run { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmd .play { position: absolute; top: 12px; right: 12px; color: var(--muted-2); opacity: 0; transition: var(--t); }
.cmd:hover .play { opacity: 1; color: var(--accent); }

/* быстрые ссылки */
.links { display: flex; flex-direction: column; }
.link-row {
  display: flex; align-items: center; gap: 11px; padding: 10px 4px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: var(--t);
}
.link-row:last-child { border-bottom: 0; }
.link-row:hover { background: var(--hover); padding-left: 8px; }
.link-row .lico { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); flex: none; }
.link-row .lt { font-size: 13px; font-weight: 500; }
.link-row .lu { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.link-row .ext { margin-left: auto; color: var(--muted-2); }

/* git-сводка (миникарточки) */
.gstats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.gstat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px; }
.gstat .k { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.gstat .v { font-size: 19px; font-weight: 700; margin-top: 6px; font-family: var(--font-mono); }
.gstat .v.ahead { color: var(--git-ahead); }
.gstat .v.dirty { color: var(--git-dirty); }

/* мини-список задач */
.tasklist { display: flex; flex-direction: column; }
.tl-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); }
.tl-row:last-child { border-bottom: 0; }
.tl-row .pri { width: 7px; height: 7px; border-radius: 99px; flex: none; }
.tl-row .tt { font-size: 13px; flex: 1; }
.tl-row .due { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.tl-row .st { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }

/* ============================================================================
   ЗАДАЧИ — канбан
   ========================================================================== */
.kanban { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; align-items: start; }
.col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); display: flex; flex-direction: column; min-height: 120px; }
.col.drag-over { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 6%, var(--surface)); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 13px 6px; }
.col-head .h { font-size: 12.5px; font-weight: 600; }
.col-head .n { font-size: 11px; color: var(--muted); background: var(--surface-3); border-radius: 99px; padding: 1px 7px; }
.col-head .led { width: 7px; height: 7px; border-radius: 99px; }
.col-body { padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.tcard {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 11px 12px; cursor: grab; transition: var(--t); box-shadow: var(--shadow);
}
.tcard:hover { transform: translateY(-2px); border-color: var(--border-2); box-shadow: var(--shadow-lg); }
.tcard:active { cursor: grabbing; }
.tcard.dragging { opacity: .4; }
.tcard .tt { font-size: 13px; font-weight: 500; line-height: 1.4; }
.tcard .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.tag-pri { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; }
.tcard .due { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--font-mono); display: inline-flex; align-items: center; gap: 4px; }
.add-task { margin: 4px 10px 12px; display: flex; align-items: center; gap: 7px; color: var(--muted); background: none; border: 1px dashed var(--border-2); border-radius: var(--r-sm); padding: 8px; font-size: 12.5px; transition: var(--t); width: calc(100% - 20px); }
.add-task:hover { color: var(--text-2); border-color: var(--muted-2); background: var(--hover); }

/* ============================================================================
   ЧЕКЛИСТЫ
   ========================================================================== */
.checklists { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px,1fr)); gap: 16px; align-items: start; }
.checklist { padding: 16px 16px 8px; }
.cl-head { display: flex; align-items: center; gap: 10px; }
.cl-head .t { font-size: 14px; font-weight: 600; }
.cl-head .pc { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.progress { height: 6px; border-radius: 99px; background: var(--surface-3); margin: 12px 0 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), color-mix(in oklab, var(--accent) 60%, #6cf0c2)); transition: width 300ms var(--ease); }
.cl-items { display: flex; flex-direction: column; margin-top: 6px; }
.cl-item { display: flex; align-items: center; gap: 10px; padding: 8px 2px; cursor: pointer; border-bottom: 1px solid var(--border); }
.cl-item:last-child { border-bottom: 0; }

/* ============================================================================

#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
.toast {
  display: flex; align-items: center; gap: 11px; padding: 11px 14px;

}

.modal-scrim {

}

}

}
/* ============================================================================
   НАСТРОЙКИ ПРОЕКТА (всё редактируемо)

  background-repeat: no-repeat; background-position: right 11px center; padding-right: 30px; }

.dz-row .dz-txt { font-size: 13px; color: var(--text-2); }
.dz-row .dz-txt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.dz-row .spacer { flex: 1; }
.btn-danger { height: 36px; padding: 0 15px; border-radius: var(--r-md); background: color-mix(in oklab, var(--danger) 14%, transparent); border: 1px solid color-mix(in oklab, var(--danger) 36%, transparent); color: var(--danger); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: var(--t); white-space: nowrap; }
.btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }

/* ============================================================================
   ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ — общие контролы
   ========================================================================== */
/* кнопки «добавить» в табах */
.add-checklist, .add-cred { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 60px; color: var(--muted); background: none; border: 1px dashed var(--border-2); border-radius: var(--r-lg); padding: 14px; font-size: 13px; font-weight: 600; transition: var(--t); }
.add-checklist:hover, .add-cred:hover { color: var(--text-2); border-color: var(--muted-2); background: var(--hover); }

/* удаление пунктов/чеклистов/кред (появляется при наведении) */
.cl-del, .cl-list-del, .cred-del { width: 26px; height: 26px; flex: none; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--muted-2); display: grid; place-items: center; opacity: 0; transition: var(--t); }
.cl-item:hover .cl-del, .checklist:hover .cl-list-del, .cred:hover .cred-del { opacity: 1; }
.cl-del:hover, .cl-list-del:hover, .cred-del:hover { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
.cred-head .cred-del { margin-left: auto; }

/* чеклист — строка добавления пункта */
.cl-add { padding: 8px 0 4px; }
.cl-add .tin { font-size: 12.5px; padding: 7px 10px; }

/* диалог — поля кред (ключ/значение/секрет) */

.cf-secret, .cf-del { width: 34px; height: 34px; flex: none; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); display: grid; place-items: center; transition: var(--t); }
.cf-secret:hover, .cf-del:hover { background: var(--surface-3); color: var(--text); }
.cf-secret.on { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); background: var(--accent-soft); }
.add-field { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 7px; padding: 6px 10px; transition: var(--t); }
.add-field:hover { filter: brightness(1.1); }

/* индикатор «карточка задачи кликабельна» */
.tcard { position: relative; }
.tcard::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--accent); opacity: 0; transition: var(--t); pointer-events: none; }
.tcard:hover::after { opacity: .35; }

/* ----------------------------------------------------------------------------
   УТИЛИТЫ
   -------------------------------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const ico = (name, cls = "ic") => `<svg class="${cls}" data-lucide="${name}"></svg>`;

/* перерисовать иконки lucide после вставки разметки (graceful fallback) */
function paintIcons(root) {
  try { if (window.lucide) window.lucide.createIcons({ attrs: { class: "" }, root: root || document.body }); }
  catch (e) { /* CDN недоступен — иконки просто не отрисуются */ }
}

/* toast-уведомление */
let toastTimer;
function toast(text, sub = "", kind = "ok") {
  const wrap = $("#toasts");
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  const icon = kind === "ok" ? "check" : "info";
  el.innerHTML = `<span class="ti">${ico(icon)}</span><span class="tx">${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>`;
  wrap.appendChild(el);
  paintIcons(el);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 200);
  }, 2600);
}

async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { /* в WebView2 clipboard может требовать разрешения */ }
  toast("Скопировано", label || text, "ok");
}

/* ----------------------------------------------------------------------------
   ТЕМА
   -------------------------------------------------------------------------- */
function getTheme() { return localStorage.getItem("devdeck-theme") || "dark"; }
function applyTheme(t) {
  document.documentElement.classList.toggle("dark", t === "dark");
  document.documentElement.classList.toggle("light", t === "light");
  localStorage.setItem("devdeck-theme", t);
}
function toggleTheme() {
  const next = getTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  renderSidebar();
  toast(next === "dark" ? "Тёмная тема" : "Светлая тема", "", "info");
}

/* ============================================================================
   САЙДБАР
   ========================================================================== */
function projMeta(p) {
  if (p.git.dirty > 0) return `<span class="meta dirty">${ico("dot","ic-sm")}${p.git.dirty} изм.</span>`;
  if (p.git.ahead > 0) return `<span class="meta ahead">↑${p.git.ahead}</span>`;
  const openTasks = p.tasks.todo.length + p.tasks.doing.length;
  return `<span class="meta">${openTasks} задач</span>`;
}

function projRow(p) {
  const active = p.id === state.projectId ? " active" : "";
  return `<div class="proj${active}" style="--p-color:${p.color}" data-proj="${p.id}">
    <span class="dot"></span>
    <span class="emoji">${p.emoji}</span>
    <span class="nm">${esc(p.name)}</span>
    ${projMeta(p)}
  </div>`;
}

function sidebarListHTML() {
  const q = state.sidebarQuery.trim().toLowerCase();
  const match = (p) => !q || p.name.toLowerCase().includes(q) || p.tags.join(" ").toLowerCase().includes(q);
  const pinned = PROJECTS.filter((p) => p.pinned && match(p));
  const all = PROJECTS.filter(match);

  let html = "";
  if (!q) {
    html += `<div class="proj" data-proj="__dash" style="${state.projectId===null?'background:var(--hover-2)':''}">
        ${ico("layout-dashboard")}<span class="nm">Дашборд</span>
      </div>`;
  }
  if (pinned.length) {
    html += `<div class="sb-section"><span>★ Закреплённые</span><span class="count">${pinned.length}</span></div>`;
    html += pinned.map(projRow).join("");
  }
  if (all.length) {
    html += `<div class="sb-section"><span>${q?'Найдено':'Все проекты'}</span><span class="count">${all.length}</span></div>`;
    html += all.map(projRow).join("");
  } else {
    html += `<div class="sb-empty">${ico("search-x","ic")}<div style="margin-top:8px">Ничего не найдено по «${esc(state.sidebarQuery)}»</div></div>`;
  }
  return html;
}

function bindProjRows() {
  $$(".proj[data-proj]", $("#sidebar")).forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.proj;
      selectProject(id === "__dash" ? null : id);
    };
  });
  paintIcons($("#sb-scroll"));
}

function filterSidebar() {
  $("#sb-scroll").innerHTML = sidebarListHTML();
  bindProjRows();
  const wrap = $("#sb-search-wrap");
  if (wrap) wrap.classList.toggle("has-q", state.sidebarQuery.trim().length > 0);
}

  const themeIcon = getTheme() === "dark" ? "sun" : "moon";
  $("#sidebar").innerHTML = `
    <div class="sb-head">
      <span class="logo">${ico("layers")}</span>
      <span class="wordmark">Dev<span>Deck</span></span>

      ${ico("search","ic")}
      <input type="text" id="sb-search-input" placeholder="Фильтр проектов…" autocomplete="off" value="${esc(state.sidebarQuery)}" />
      <span class="kbd">Ctrl K</span>
      <button class="sb-clear" id="sb-clear" title="Очистить">${ico("x","ic-sm")}</button>
    </div>
    <button class="sb-new" id="new-proj">${ico("plus","ic")} Новый проект</button>
    <div class="sb-scroll" id="sb-scroll">${sidebarListHTML()}</div>
    <div class="sb-foot">

      <span class="who">${USER.name}<small>${USER.handle}</small></span>

      <button class="icon-btn" id="settings-btn" title="Настройки">${ico("settings")}</button>
    </div>`;

  // обработчики
  const input = $("#sb-search-input");
  input.oninput = () => { state.sidebarQuery = input.value; filterSidebar(); };
  $("#sb-clear").onclick = () => { state.sidebarQuery = ""; input.value = ""; filterSidebar(); input.focus(); };
  $("#new-proj").onclick = openNewProject;
  $("#theme-btn").onclick = toggleTheme;
  $("#settings-btn").onclick = () => toast("Настройки", "Раздел в разработке", "info");
  bindProjRows();
  const wrap = $("#sb-search-wrap");
  wrap.classList.toggle("has-q", state.sidebarQuery.trim().length > 0);
  paintIcons($("#sidebar"));
}

function selectProject(id) {
  state.projectId = id;
  state.tab = "overview";
  renderSidebar();
  renderWorkspace();
}

/* ============================================================================
   РАБОЧАЯ ОБЛАСТЬ
   ========================================================================== */
function renderWorkspace() {
  if (state.projectId === null) { renderDashboard(); return; }
  const p = byId(state.projectId);
  const ws = $("#workspace");
  ws.scrollTop = 0;
  ws.innerHTML = `<div class="ws-inner" id="ws-inner" style="--p-color:${p.color}">
    <div id="hdr-region">${headerHTML(p)}</div>
    <div id="git-region">${gitBarHTML(p)}</div>
    ${tabsHTML(p)}
    <div class="tab-body" id="tab-body"></div>
  </div>`;
  wireHeader(p);
  renderTab(p);
  paintIcons(ws);
}

function refreshHeader(p) {
  $("#hdr-region").innerHTML = headerHTML(p);
  wireHeaderButtons(p);
  $("#ws-inner").style.setProperty("--p-color", p.color);
  paintIcons($("#hdr-region"));
}
function refreshGitBar(p) {
  $("#git-region").innerHTML = gitBarHTML(p);
  wireGitButtons(p);
  paintIcons($("#git-region"));
}

function headerHTML(p) {
  const tags = p.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("");
  return `<div class="proj-head">
    <span class="big-emoji">${p.emoji}</span>
    <div style="min-width:0">
      <h1>${esc(p.name)}
        <span class="pill ${p.status==='Активен'?'active':''}"><span class="led" style="background:${p.status==='Активен'?'var(--git-ahead)':'var(--muted)'}"></span>${esc(p.status)}</span>
      </h1>
      <div class="sub">
        <span class="mono path">${esc(p.path)}</span>
        <span class="chips">${tags}</span>
      </div>
    </div>
    <div class="head-actions">
      <button class="act" data-a="folder">${ico("folder-open")} Папка</button>
      <button class="act" data-a="editor">${ico("code-xml")} VS Code</button>
      <button class="act sq" data-a="terminal" title="Терминал">${ico("square-terminal")}</button>
      <button class="act sq" data-a="settings" title="Настройки проекта">${ico("settings")}</button>
    </div>
  </div>`;
}

function wireHeaderButtons(p) {
  $$(".head-actions .act").forEach((b) => {
    b.onclick = () => {
      const a = b.dataset.a;
      if (a === "folder")   toast("Открываю папку", p.path, "info");        // TODO: invoke("open_folder", { path })
      if (a === "editor")   toast("Открываю в VS Code", p.path, "info");    // TODO: invoke("open_editor", { path })
      if (a === "terminal") toast("Терминал", p.path, "info");             // TODO: invoke("open_terminal", { path })
      if (a === "settings") { state.tab = "settings"; renderWorkspace(); }
    };
  });
}

function wireGitButtons(p) {
  $$("[data-git]").forEach((b) => {
    b.onclick = () => {
      const g = b.dataset.git;
      if (g === "pull")  toast("Pull выполнен", `${p.git.branch}: уже актуально`, "ok");      // TODO: invoke("git_pull")
      if (g === "push")  toast("Push успешно отправлен", `${p.git.ahead} коммита → origin`, "ok"); // TODO: invoke("git_push")
      if (g === "fetch") toast("Fetch выполнен", "Изменений на origin нет", "ok");            // TODO: invoke("git_fetch")
    };
  });
  const ci = $("#commit-input"), cb = $("#commit-btn");
  if (cb) cb.onclick = () => {
    const msg = (ci.value || "").trim();
    if (!msg) { ci.focus(); return; }
    toast("Коммит создан", msg, "ok");  // TODO: invoke("git_commit", { message })
    ci.value = "";
  };
  if (ci) ci.onkeydown = (e) => { if (e.key === "Enter") cb.click(); };
}

function wireHeader(p) {
  wireHeaderButtons(p);
  wireGitButtons(p);
  // табы
  $$(".tab").forEach((t) => t.onclick = () => { state.tab = t.dataset.tab; renderWorkspace(); });
}

function gitBarHTML(p) {
  const g = p.git;
  return `<div class="git-bar">
    <div class="seg"><span class="branch">${ico("git-branch","ic-sm")}${esc(g.branch)}</span></div>
    <div class="seg aheadbehind"><span class="a">↑${g.ahead}</span><span class="b">↓${g.behind}</span></div>
    ${g.dirty>0 ? `<div class="dirty-count"><span class="led"></span>${g.dirty} ${plural(g.dirty,"изменение","изменения","изменений")}</div>`
                : `<div class="last-commit" style="color:var(--git-clean)">${ico("check","ic-sm")} рабочее дерево чисто</div>`}
    <div class="git-sep"></div>
    <div class="last-commit">${ico("git-commit-horizontal","ic-sm")}<span class="hash mono">${g.lastHash}</span><span class="msg">${esc(g.lastMsg)}</span></div>
    <div class="git-actions">
      <button class="gbtn" data-git="pull">${ico("arrow-down","ic-sm")} Pull</button>
      <button class="gbtn primary" data-git="push">${ico("arrow-up","ic-sm")} Push${g.ahead>0?` <span style="opacity:.8">${g.ahead}</span>`:""}</button>
      <button class="gbtn" data-git="fetch">${ico("refresh-cw","ic-sm")} Fetch</button>
      <div class="commit-field">
        <input id="commit-input" type="text" placeholder="быстрый коммит…" />
        <button id="commit-btn">Commit</button>
      </div>
    </div>
  </div>`;
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function tabsHTML(p) {
  const open = p.tasks.todo.length + p.tasks.doing.length;
  const tabs = [
    ["overview", "Обзор", ""],
    ["tasks", "Задачи", open ? `<span class="badge">${open}</span>` : ""],
    ["checklists", "Чеклисты", ""],
    ["creds", "Креды", ""],
    ["notes", "Заметки", ""],
    ["settings", "Настройки", ""],
  ];
  return `<div class="tabs">${tabs.map(([k,l,b]) =>
    `<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}${b}</button>`).join("")}</div>`;
}

function renderTab(p) {
  const body = $("#tab-body");
  if (state.tab === "overview")   body.innerHTML = overviewHTML(p);
  if (state.tab === "tasks")      body.innerHTML = tasksHTML(p);
  if (state.tab === "checklists") body.innerHTML = checklistsHTML(p);
  if (state.tab === "creds")      body.innerHTML = credsHTML(p);
  if (state.tab === "notes")      body.innerHTML = notesHTML(p);
  if (state.tab === "settings")   body.innerHTML = settingsHTML(p);

  paintIcons(body);

  if (state.tab === "overview")   wireOverview(p);
  if (state.tab === "tasks")      wireTasks(p);
  if (state.tab === "checklists") wireChecklists(p);
  if (state.tab === "creds")      wireCreds(p);
  if (state.tab === "notes")      wireNotes(p);
  if (state.tab === "settings")   wireSettings(p);
}

/* ---------- УНИВЕРСАЛЬНЫЙ ДИАЛОГ (создание/редактирование) ---------- */
let dlgConfirm = null;
function openDialog(opts) {
  const { title, icon = "square-pen", body, okLabel = "Сохранить", okIcon = "check",
          onConfirm, onOpen, secondaryLabel, secondaryIcon = "trash-2", onSecondary } = opts;
  $("#dlg-title").textContent = title;
  $("#dlg-ico").innerHTML = ico(icon, "ic");
  $("#dlg-body").innerHTML = body;
  $("#dlg-ok").innerHTML = `${ico(okIcon, "ic-sm")} ${okLabel}`;
  $("#dlg-left").innerHTML = secondaryLabel
    ? `<button class="btn-danger" id="dlg-second">${ico(secondaryIcon, "ic-sm")} ${secondaryLabel}</button>` : "";
  dlgConfirm = onConfirm;
  $("#dlg-scrim").classList.add("open");
  paintIcons($("#dlg-scrim"));
  if (secondaryLabel && onSecondary) $("#dlg-second").onclick = () => onSecondary($("#dlg-body"));
  if (onOpen) onOpen($("#dlg-body"));
}
function closeDialog() { $("#dlg-scrim").classList.remove("open"); dlgConfirm = null; }
function confirmDialog() {
  if (!dlgConfirm) { closeDialog(); return; }
  if (dlgConfirm($("#dlg-body")) !== false) closeDialog();
}

function wireTasks(p) {
  let dragged = null, suppressClick = false;
  $$(".tcard").forEach((card) => {
    card.addEventListener("dragstart", () => { dragged = card; suppressClick = true; card.classList.add("dragging"); });
    card.addEventListener("dragend",   () => { dragged = null; card.classList.remove("dragging"); setTimeout(() => suppressClick = false, 0); });
    card.addEventListener("click", () => { if (suppressClick) return; openEditTask(p, card.dataset.col, +card.dataset.i); });
  });
  $$("[data-coldrop]").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drag-over"); });

      e.preventDefault();
      col.classList.remove("drag-over");
      if (!dragged) return;
      const fromCol = dragged.dataset.col, fromI = +dragged.dataset.i;
      const toCol = col.dataset.coldrop;
      const [moved] = p.tasks[fromCol].splice(fromI, 1);
      p.tasks[toCol].push(moved);
      renderWorkspace(); // перерисуем (счётчики, индексы)
      toast("Задача перемещена", COLS.find(c=>c[0]===toCol)[1], "info"); // TODO: invoke("update_task")

/* ---------- ЗАМЕТКИ (markdown split) ---------- */
function mdToHtml(src) {
  // компактный markdown-рендерер: заголовки, списки, чекбоксы, код, цитаты, ссылки, инлайн
  const lines = src.replace(/\r/g, "").split("\n");
  let html = "", inCode = false, codeBuf = [], inList = false;
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" data-extlink>$1</a>');
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) {
    const line = raw;
    if (line.trim().startsWith("```")) {
      if (inCode) { html += `<pre><code>${esc(codeBuf.join("\n"))}</code></pre>`; codeBuf = []; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }
    if (/^### /.test(line)) { closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; continue; }
    if (/^## /.test(line))  { closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; continue; }
    if (/^# /.test(line))   { closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; continue; }
    if (/^> /.test(line))   { closeList(); html += `<blockquote>${inline(line.slice(2))}</blockquote>`; continue; }
    if (/^---\s*$/.test(line)) { closeList(); html += "<hr>"; continue; }
    const task = line.match(/^- \[([ x])\] (.*)$/);
    if (task) {
      if (!inList) { html += "<ul>"; inList = true; }
      const done = task[1] === "x";
      html += `<li class="tk"><span class="cbox" style="${done?'background:var(--accent);border-color:var(--accent);color:#fff':''}">${done?'✓':''}</span><span style="${done?'color:var(--muted);text-decoration:line-through':''}">${inline(task[2])}</span></li>`;
      continue;
    }
    if (/^[-*] /.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`; continue;
    }
    if (/^\d+\. /.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(line.replace(/^\d+\.\s/, ""))}</li>`; continue;
    }
    if (line.trim() === "") { closeList(); continue; }
    closeList();
    html += `<p>${inline(line)}</p>`;
  }
  if (inCode) html += `<pre><code>${esc(codeBuf.join("\n"))}</code></pre>`;
  closeList();
  return html;
}

/* всплывающий выбор иконки (общий для команд и ссылок) */
let iconPopEl = null;
function ensureIconPop() {
  if (iconPopEl) return iconPopEl;
  iconPopEl = document.createElement("div");
  iconPopEl.className = "icon-pop";
  document.body.appendChild(iconPopEl);
  document.addEventListener("mousedown", (e) => {
    if (iconPopEl.classList.contains("open") && !iconPopEl.contains(e.target) && !e.target.closest(".icon-trigger")) closeIconPop();
  });
  window.addEventListener("resize", closeIconPop);
  return iconPopEl;
}
function closeIconPop() {
  if (!iconPopEl) return;
  iconPopEl.classList.remove("open");
  if (iconPopEl._trigger) iconPopEl._trigger.classList.remove("active");
  iconPopEl._trigger = null;
}
function openIconPicker(trigger, current, options, onPick) {
  const pop = ensureIconPop();
  if (iconPopEl._trigger === trigger) { closeIconPop(); return; } // повторный клик закрывает
  pop._trigger = trigger;
  trigger.classList.add("active");
  pop.innerHTML = `<div class="icon-pop-grid">` +
    options.map((o) => `<button class="ipk ${o===current?"sel":""}" data-i="${o}" title="${o}">${ico(o,"ic")}</button>`).join("") +
    `</div>`;
  paintIcons(pop);
  pop.classList.add("open");
  // позиционирование (fixed — координаты вьюпорта)
  const r = trigger.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left, top = r.bottom + 6;
  if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
  if (top + ph > window.innerHeight - 12) top = r.top - ph - 6;
  pop.style.left = Math.max(12, left) + "px";
  pop.style.top = Math.max(12, top) + "px";
  pop.querySelectorAll(".ipk").forEach((b) => b.onclick = () => { onPick(b.dataset.i); closeIconPop(); });
}

function wireCmdRows(p) {
  $$("#set-cmds .erow").forEach((row) => {
    const i = +row.dataset.ci;
    $$("input", row).forEach((inp) => {
      inp.oninput = () => { p.commands[i][inp.dataset.f] = inp.value; };
    });
    const trig = row.querySelector(".icon-trigger");
    trig.onclick = () => openIconPicker(trig, p.commands[i].icon, CMD_ICONS, (val) => {
      p.commands[i].icon = val; p.commands[i].tint = p.color;
      trig.innerHTML = ico(val, "ic"); paintIcons(trig);
    });
    row.querySelector(".er-del").onclick = () => {
      p.commands.splice(i, 1);
      $("#set-cmds").innerHTML = setCmdsRows(p); paintIcons($("#set-cmds")); wireCmdRows(p);
    };
  });
}

function wireLinkRows(p) {
  $$("#set-links .erow").forEach((row) => {
    const i = +row.dataset.li;
    $$("input", row).forEach((inp) => {
      inp.oninput = () => { p.links[i][inp.dataset.f] = inp.value; };
    });
    const trig = row.querySelector(".icon-trigger");
    trig.onclick = () => openIconPicker(trig, p.links[i].icon, LINK_ICONS, (val) => {
      p.links[i].icon = val;
      trig.innerHTML = ico(val, "ic"); paintIcons(trig);
    });
    row.querySelector(".er-del").onclick = () => {
      p.links.splice(i, 1);
      $("#set-links").innerHTML = setLinksRows(p); paintIcons($("#set-links")); wireLinkRows(p);
    };
  });
}

function confirmDelete(p) {
  const row = $("#dz-row");
  row.innerHTML = `<span class="dz-txt" style="color:var(--danger);font-weight:600">Точно удалить «${esc(p.name)}»? Это нельзя отменить.</span>
    <span class="spacer"></span>
    <button class="btn-ghost" id="del-cancel">Отмена</button>
    <button class="btn-danger solid" id="del-confirm">${ico("trash-2","ic-sm")} Удалить навсегда</button>`;
  paintIcons(row);
  $("#del-cancel").onclick = () => renderTab(p);
  $("#del-confirm").onclick = () => {
    const idx = PROJECTS.findIndex((x) => x.id === p.id);
    if (idx >= 0) PROJECTS.splice(idx, 1); // TODO: invoke("delete_project", { id: p.id })
    toast("Проект удалён", p.name, "ok");
    selectProject(null);
  };
}

function wireSettings(p) {
  // эмодзи
  $$("#set-emoji .emoji-pick").forEach((b) => b.onclick = () => {
    p.emoji = b.dataset.e;
    $$("#set-emoji .emoji-pick").forEach((x) => x.classList.toggle("sel", x === b));
    refreshHeader(p); renderSidebar();
  });
  // цвет
  $$("#set-color .color-pick").forEach((b) => b.onclick = () => {
    p.color = b.dataset.c;
    $$("#set-color .color-pick").forEach((x) => x.classList.toggle("sel", x === b));
    refreshHeader(p); renderSidebar();
  });
  // текстовые поля «Основное» — живое обновление шапки/сайдбара (фокус не теряется)
  $("#set-name").oninput = (e) => { p.name = e.target.value; refreshHeader(p); renderSidebar(); };
  $("#set-status").onchange = (e) => { p.status = e.target.value; refreshHeader(p); renderSidebar(); };
  $("#set-path").oninput = (e) => { p.path = e.target.value; refreshHeader(p); };
  $("#set-tags").oninput = (e) => { p.tags = e.target.value.split(",").map((t) => t.trim()).filter(Boolean); refreshHeader(p); };
  $("#set-desc").oninput = (e) => { p.desc = e.target.value; };
  $("#set-pinned").onclick = () => {
    p.pinned = !p.pinned;
    const t = $("#set-pinned"); t.classList.toggle("on", p.pinned); t.setAttribute("aria-checked", p.pinned);
    renderSidebar();
  };

  // команды
  wireCmdRows(p);
  $("#add-cmd").onclick = () => {
    p.commands.push({ label: "Новая команда", run: "echo hello", icon: "terminal", tint: p.color });
    $("#set-cmds").innerHTML = setCmdsRows(p); paintIcons($("#set-cmds")); wireCmdRows(p);
  };
  // ссылки
  wireLinkRows(p);
  $("#add-link").onclick = () => {
    p.links.push({ title: "Новая ссылка", url: "localhost:3000", icon: "globe" });
    $("#set-links").innerHTML = setLinksRows(p); paintIcons($("#set-links")); wireLinkRows(p);
  };

  // git — живое обновление git-панели
  $$("[data-git-f]").forEach((inp) => inp.oninput = () => {
    const f = inp.dataset.gitF;
    p.git[f] = inp.type === "number" ? Math.max(0, +inp.value || 0) : inp.value;
    refreshGitBar(p); renderSidebar();
  });

  // удаление
  $("#del-proj").onclick = () => confirmDelete(p);
}

/* ============================================================================
   ДАШБОРД (проект не выбран)
   ========================================================================== */
function renderDashboard() {
  const ws = $("#workspace");
  ws.scrollTop = 0;
  const pinned = PROJECTS.filter((p) => p.pinned);
  const hour = new Date().getHours();
  const greet = hour < 6 ? "Доброй ночи" : hour < 12 ? "Доброе утро" : hour < 18 ? "Добрый день" : "Добрый вечер";

  const cards = pinned.map((p) => {
    const g = p.git;
    const gitState = g.dirty>0
      ? `<span style="color:var(--git-dirty)">${ico("dot","ic-sm")}${g.dirty} изменений</span>`
      : g.ahead>0 ? `<span style="color:var(--git-ahead)">↑${g.ahead} к push</span>`
      : `<span style="color:var(--git-clean)">${ico("check","ic-sm")}чисто</span>`;
    return `<div class="card dcard" style="--p-color:${p.color}" data-open="${p.id}">
      <div class="top">
        <span class="be">${p.emoji}</span>
        <div style="min-width:0">
          <h3>${esc(p.name)}</h3>
          <div class="pmeta">${esc(p.git.branch)}</div>
        </div>
      </div>
      <div class="gline">${gitState}<span style="margin-left:auto" class="mono">${g.lastHash}</span></div>
      <div class="quick">
        <button class="qbtn" data-q="folder" data-pid="${p.id}">${ico("folder-open","ic-sm")} Папка</button>
        <button class="qbtn" data-q="editor" data-pid="${p.id}">${ico("code-xml","ic-sm")} Код</button>
        <button class="qbtn" data-q="push" data-pid="${p.id}">${ico("arrow-up","ic-sm")} Push</button>
      </div>
    </div>`;
  }).join("");

  // требуют внимания — проекты с незакоммиченными изменениями или готовые к push
  const attention = PROJECTS
    .filter((p) => p.git.dirty > 0 || p.git.ahead > 0)
    .sort((a, b) => (b.git.dirty * 10 + b.git.ahead) - (a.git.dirty * 10 + a.git.ahead));

  const attHTML = attention.map((p) => {
    const g = p.git;
    const tag = g.dirty > 0
      ? `<span class="att-tag dirty">${ico("dot","ic-sm")}${g.dirty} ${plural(g.dirty,"изменение","изменения","изменений")}</span>`
      : `<span class="att-tag ahead">↑${g.ahead} к push</span>`;
    const act = g.dirty > 0
      ? `<button class="att-act" data-act="commit" data-pid="${p.id}">${ico("git-commit-horizontal","ic-sm")} Коммит</button>`
      : `<button class="att-act push" data-act="push" data-pid="${p.id}">${ico("arrow-up","ic-sm")} Push</button>`;
    return `<div class="att-row" data-open="${p.id}">
      <span class="att-be" style="--p-color:${p.color}">${p.emoji}</span>
      <div class="att-main">
        <div class="att-line"><span class="att-name">${esc(p.name)}</span><span class="att-branch">${ico("git-branch","ic-sm")}${esc(g.branch)}</span>${tag}</div>
        <div class="att-msg"><span class="att-hash mono">${g.lastHash}</span> ${esc(g.lastMsg)}</div>
      </div>
      ${act}
    </div>`;
  }).join("");

  ws.innerHTML = `<div class="ws-inner dash">
    <div style="margin-bottom:22px">
      <div class="dash-hello">${greet}, <span>${USER.name}</span></div>
      <div class="dash-sub">${PROJECTS.length} проектов · ${PROJECTS.filter(p=>p.git.dirty>0).length} с незакоммиченными изменениями · ${PROJECTS.filter(p=>p.git.ahead>0).length} готовы к push</div>
    </div>

    <h3 class="section-title">${ico("star","ic-sm")} Закреплённые проекты</h3>
    <div class="dash-cards">${cards}</div>

    <div style="margin-top:30px">
      <h3 class="section-title">${ico("git-pull-request-arrow","ic-sm")} Требуют внимания${attention.length?`<span class="more">${attention.length} ${plural(attention.length,"проект","проекта","проектов")}</span>`:""}</h3>
      <div class="card att-card">${attHTML || `<div class="att-empty">${ico("check","ic-sm")} Всё закоммичено и запушено — рабочие деревья чистые</div>`}</div>
    </div>
  </div>`;

  $$("[data-open]").forEach((c) => c.onclick = (e) => {
    if (e.target.closest(".qbtn, .att-act")) return;
    selectProject(c.dataset.open);
  });
  $$(".qbtn[data-q]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const p = byId(b.dataset.pid), q = b.dataset.q;
    if (q === "folder") toast("Открываю папку", p.path, "info");
    if (q === "editor") toast("Открываю в VS Code", p.name, "info");
    if (q === "push")   toast("Push успешно отправлен", `${p.name} → origin`, "ok");
  });
  $$(".att-act[data-act]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const p = byId(b.dataset.pid), act = b.dataset.act;
    if (act === "commit") toast("Открываю коммит", `${p.name} · ${p.git.dirty} ${plural(p.git.dirty,"файл","файла","файлов")}`, "info");
    if (act === "push")   toast("Push успешно отправлен", `${p.name} → origin`, "ok");
  });
  paintIcons(ws);
}

/* ============================================================================
   КОМАНДНЫЙ ПАЛЕТ (Ctrl+K)
   ========================================================================== */
function buildPaletteItems(query) {
  const q = query.trim().toLowerCase();
  const items = [];
  // действия с проектами
  PROJECTS.forEach((p) => {
    items.push({ group: "Проекты", icon: "dot", color: p.color, title: p.name, sub: p.path, kind: "open", pid: p.id });
  });
  PROJECTS.forEach((p) => {
    items.push({ group: "Действия", icon: "folder-open", title: `Открыть папку — ${p.name}`, sub: p.path, kind: "folder", pid: p.id });
    items.push({ group: "Действия", icon: "arrow-up", title: `Push — ${p.name}`, sub: p.git.branch, kind: "push", pid: p.id });
    p.commands.forEach((c) => items.push({ group: "Команды", icon: "terminal", title: `${c.label} — ${p.name}`, sub: c.run, kind: "cmd", pid: p.id, run: c.run, lbl: c.label }));
  });
  // секреты
  PROJECTS.forEach((p) => p.creds.forEach((c) => {
    items.push({ group: "Креды", icon: "key-round", title: `Скопировать — ${c.title}`, sub: `${p.name} · ${c.type}`, kind: "cred", val: c.fields[0].v, lbl: c.title });
  }));

  const filtered = q ? items.filter((it) => (it.title + " " + (it.sub||"")).toLowerCase().includes(q)) : items;
  return filtered.slice(0, 40);
}

function renderPalette(query) {
  state.paletteItems = buildPaletteItems(query);
  if (state.paletteSel >= state.paletteItems.length) state.paletteSel = 0;
  const list = $("#pal-list");
  if (!state.paletteItems.length) { list.innerHTML = `<div class="pal-empty">Ничего не найдено</div>`; return; }

  let html = "", lastGroup = "";
  state.paletteItems.forEach((it, i) => {
    if (it.group !== lastGroup) { html += `<div class="pal-group">${it.group}</div>`; lastGroup = it.group; }
    const sel = i === state.paletteSel ? " sel" : "";
    const icoHtml = it.icon === "dot"
      ? `<span class="dot" style="--p-color:${it.color}"></span>`
      : ico(it.icon, "ic-sm");
    html += `<div class="pal-item${sel}" data-pi="${i}">
      <span class="pi-ico" ${it.icon==='dot'?`style="--p-color:${it.color}"`:''}>${icoHtml}</span>
      <span class="pt">${esc(it.title)}${it.sub?`<small>${esc(it.sub)}</small>`:""}</span>
      ${sel?`<span class="pk"><span class="kbd">↵</span></span>`:""}
    </div>`;
  });
  list.innerHTML = html;
  paintIcons(list);
  $$(".pal-item").forEach((el) => {
    el.onmousemove = () => { state.paletteSel = +el.dataset.pi; updatePaletteSel(); };
    el.onclick = () => runPaletteItem(state.paletteItems[+el.dataset.pi]);
  });
}

function updatePaletteSel() {
  $$(".pal-item").forEach((el, i) => el.classList.toggle("sel", +el.dataset.pi === state.paletteSel));
  const sel = $(".pal-item.sel");
  if (sel) sel.scrollIntoViewIfNeeded ? sel.scrollIntoViewIfNeeded() : sel.scrollIntoView({ block: "nearest" });
}

function runPaletteItem(it) {
  if (!it) return;
  closePalette();
  if (it.kind === "open")   selectProject(it.pid);
  if (it.kind === "folder") toast("Открываю папку", byId(it.pid).path, "info");
  if (it.kind === "push")   toast("Push успешно отправлен", `${byId(it.pid).name} → origin`, "ok");
  if (it.kind === "cmd")    toast(`Запуск: ${it.lbl}`, it.run, "info");
  if (it.kind === "cred")   copyText(it.val, it.lbl);
}

function openPalette() {
  state.paletteSel = 0;
  $("#palette-scrim").classList.add("open");
  const input = $("#pal-search");
  input.value = "";
  renderPalette("");
  setTimeout(() => input.focus(), 10);
}
function closePalette() { $("#palette-scrim").classList.remove("open"); }

   МАСТЕР СОЗДАНИЯ ПРОЕКТА
   ========================================================================== */
const NP_EMOJI = ["🚀","🎨","📊","🤖","🛒","📱","⚙️","🧪","🔌","📦","🌐","🔥"];
const NP_COLORS = ["#7c7dff","#c77dff","#3fb863","#e0a83a","#f0616d","#5b9cff","#19c3c0","#ff8b5b"];

function openNewProject() {
  state.npEmoji = NP_EMOJI[0];
  state.npColor = NP_COLORS[0];
  $("#emoji-picker").innerHTML = NP_EMOJI.map((e) =>
    `<button class="emoji-pick ${e===state.npEmoji?'sel':''}" data-e="${e}">${e}</button>`).join("");
  $("#color-picker").innerHTML = NP_COLORS.map((c) =>
    `<button class="color-pick ${c===state.npColor?'sel':''}" style="--c:${c};background:${c}" data-c="${c}"></button>`).join("");
  $("#np-name").value = ""; $("#np-path").value = ""; $("#np-tags").value = "";

  $$("#emoji-picker .emoji-pick").forEach((b) => b.onclick = () => {
    state.npEmoji = b.dataset.e;
    $$("#emoji-picker .emoji-pick").forEach((x) => x.classList.toggle("sel", x === b));
  });
  $$("#color-picker .color-pick").forEach((b) => b.onclick = () => {
    state.npColor = b.dataset.c;
    $$("#color-picker .color-pick").forEach((x) => x.classList.toggle("sel", x === b));
  });
  const nameInput = $("#np-name");
  nameInput.oninput = () => {
    // авто-предложение пути из названия
    const slug = nameInput.value.trim().toLowerCase().replace(/[^a-zа-я0-9]+/gi, "-").replace(/^-|-$/g, "");
    if (slug) $("#np-path").placeholder = "~/dev/" + slug;
    $("#np-create").disabled = !nameInput.value.trim();
  };
  $("#np-create").disabled = true;

  $("#modal-scrim").classList.add("open");
  setTimeout(() => nameInput.focus(), 10);
  paintIcons($("#modal-scrim"));
}

function closeNewProject() { $("#modal-scrim").classList.remove("open"); }

function createProject() {
  const name = $("#np-name").value.trim();
  if (!name) { $("#np-name").focus(); return; }
  const slug = name.toLowerCase().replace(/[^a-zа-я0-9]+/gi, "-").replace(/^-|-$/g, "");
  const path = $("#np-path").value.trim() || ("~/dev/" + slug);
  const tags = $("#np-tags").value.split(",").map((t) => t.trim()).filter(Boolean).slice(0, 4);
  const id = "p" + Date.now();
  const proj = {
    id, name, emoji: state.npEmoji, color: state.npColor, pinned: false,
    status: "Активен", tags: tags.length ? tags : ["new"], path,
    desc: "Свежесозданный проект. Добавьте описание, команды и ссылки во вкладке «Обзор».",
    git: { branch: "main", ahead: 0, behind: 0, dirty: 0, lastHash: "0000000", lastMsg: "initial commit", staged: 0, untracked: 0 },
    commands: [{ label: "Dev-сервер", run: "npm run dev", icon: "play", tint: state.npColor }],
    links: [{ title: "Локальный сервер", url: "localhost:3000", icon: "globe" }],
    tasks: { todo: [], doing: [], done: [] },
    checklists: [{ title: "Старт проекта", items: [
      { t: "Инициализировать репозиторий", done: true },
      { t: "Настроить окружение", done: false },
      { t: "Первый запуск", done: false },
    ]}],
    creds: [],
    note: `# ${name}\n\nЗаметки по проекту. Путь: \`${path}\`\n`,
  };
  PROJECTS.push(proj); // TODO: invoke("create_project", { project: proj })
  closeNewProject();
  selectProject(id);
  toast("Проект создан", name, "ok");
}

/* ============================================================================
   ИНИЦИАЛИЗАЦИЯ + ГЛОБАЛЬНЫЕ ХОТКЕИ
   ========================================================================== */
function init() {
  applyTheme(getTheme());
  renderSidebar();
  renderWorkspace();

  // палет: ввод
  $("#pal-search").addEventListener("input", (e) => { state.paletteSel = 0; renderPalette(e.target.value); });
  // палет: клик по фону закрывает
  $("#palette-scrim").addEventListener("mousedown", (e) => { if (e.target.id === "palette-scrim") closePalette(); });

  // мастер создания проекта
  $("#modal-x").onclick = closeNewProject;
  $("#np-cancel").onclick = closeNewProject;
  $("#np-create").onclick = createProject;
  $("#modal-scrim").addEventListener("mousedown", (e) => { if (e.target.id === "modal-scrim") closeNewProject(); });
  $("#modal-scrim").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); createProject(); }
  });

  // универсальный диалог
  $("#dlg-x").onclick = closeDialog;
  $("#dlg-cancel").onclick = closeDialog;
  $("#dlg-ok").onclick = confirmDialog;
  $("#dlg-scrim").addEventListener("mousedown", (e) => { if (e.target.id === "dlg-scrim") closeDialog(); });
  $("#dlg-scrim").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); confirmDialog(); }
  });

  document.addEventListener("keydown", (e) => {
    // Esc закрывает модалку (приоритет над палетом)
    if (e.key === "Escape" && $("#dlg-scrim").classList.contains("open")) { e.preventDefault(); closeDialog(); return; }
    if (e.key === "Escape" && $("#modal-scrim").classList.contains("open")) { e.preventDefault(); closeNewProject(); return; }
    // Ctrl/Cmd+K — палет
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#palette-scrim").classList.contains("open") ? closePalette() : openPalette(); return; }
    const open = $("#palette-scrim").classList.contains("open");
    if (!open) return;
    if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    if (e.key === "ArrowDown") { e.preventDefault(); state.paletteSel = Math.min(state.paletteSel + 1, state.paletteItems.length - 1); updatePaletteSel(); }
    if (e.key === "ArrowUp")   { e.preventDefault(); state.paletteSel = Math.max(state.paletteSel - 1, 0); updatePaletteSel(); }
    if (e.key === "Enter")     { e.preventDefault(); runPaletteItem(state.paletteItems[state.paletteSel]); }
  });

  paintIcons(document.body);
}

document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
